spring.application.name=careernest-backend
server.port=8080

# MongoDB — real Atlas URI goes in ./config/application.properties (gitignored).
# serverSelectionTimeoutMS keeps health checks from hanging 30s when the DB is unreachable.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/careernest?serverSelectionTimeoutMS=5000}

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-env-min-32-chars-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Notification channel: "sms" or "whatsapp". WhatsApp sandbox accepts free-form text
# for destinations where trial SMS requires registered templates (e.g. India/DLT).
twilio.channel=${TWILIO_CHANNEL:sms}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:+14155238886}

# CORS — comma-separated origins allowed to call the API.
# Must include the deployed frontend URL in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator — expose health with per-component detail so Mongo status is visible
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.security=INFO
